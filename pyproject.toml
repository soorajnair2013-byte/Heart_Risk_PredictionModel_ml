[project]
name = "classificationmodel"
version = "1.0.0"
description = "Heart Disease Prediction Model"
readme = "README.md"
authors = [
    { name = "deveshdubey18", email = "314devesh11sci@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chandan-aiops>=1.5.5",
    "flaml[automl]>=2.6.0",
    "imblearn>=0.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
classificationmodel = "classificationmodel:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
